[versions]
agp = "8.13.2"
ftc = "2.1.2"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.7.1"
material = "1.10.0"
robotcore = "11.1.0"
telemetry = "1.0.0"
photon = "v3.0.1-ALPHA"

[libraries]
ftc = { module = "com.pedropathing:ftc", version.ref = "ftc" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
robotcore = { module = "org.firstinspires.ftc:RobotCore", version.ref = "robotcore" }
hardware = { module = "org.firstinspires.ftc:Hardware", version.ref = "robotcore" }
telemetry = { module = "com.pedropathing:telemetry", version.ref = "telemetry" }
photon = { module = "com.github.Eeshwar-Krishnan:PhotonFTC", version.ref = "photon" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

